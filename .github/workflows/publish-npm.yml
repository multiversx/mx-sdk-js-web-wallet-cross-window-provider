name: Publish sdk-web-wallet-cross-window-provider

on:
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run compile

      - name: Get package info
        id: package
        uses: andreigiura/action-nodejs-package-info@v1.0.2

      - name: Publish to npmjs next version
        if: ${{ steps.package.outputs.is-prerelease == 'true' }}
        run: npm publish --tag next

      - name: Publish to npmjs
        if: ${{ steps.package.outputs.is-prerelease == 'false' }}
        run: npm publish
